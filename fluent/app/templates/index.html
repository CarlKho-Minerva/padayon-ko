<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Communication Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.3/purify.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#60A1E8',
                    },
                },
            },
        }
    </script>

    <style>
        .water-cooler-prompt {
            background-color: #f0f4f8;
            border-left: 4px solid #60A1E8;
            padding: 1rem;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .feedback-container {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 0.25rem;
            padding: 1rem;
            margin-top: 1rem;
        }

        .record-btn {
            font-size: 1.2rem;
            padding: 1rem 2rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .record-btn.recording {
            background-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        .thinking {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            background-color: #f3f4f6;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #60A1E8;
            border-radius: 50%;
            animation: bounce 0.5s infinite alternate;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-5px);
            }
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #60A1E8;
            font-family: monospace;
        }

        .subtitles {
            display: none;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            text-align: center;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .message-audio {
            width: 100%;
            height: 30px;
            margin-top: 0.5rem;
        }

        .message-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        #end-conversation-btn {
            background-color: #ef4444;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        #end-conversation-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>

<body class="bg-white font-sans">
    <div class="container mx-auto px-4 py-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Water Cooler Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-accent">Fluent by Padayon Ko</h2>
                <div id="water-cooler-prompt" class="water-cooler-prompt text-gray-700 mb-4"></div>
                <div class="flex flex-col gap-3">
                    <button id="randomize-prompt" class="bg-accent text-white px-4 py-2 rounded hover:bg-accent/80 transition">
                        <i class="fas fa-random mr-2"></i>Randomize Prompt
                    </button>
                    <button id="end-conversation-btn" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">
                        <i class="fas fa-stop-circle mr-2"></i>End and Receive Feedback
                    </button>
                </div>
                <p class="text-sm text-gray-500 mt-2">Made with love 🫶 by <u><a href="http://carlkho.com">Carl Kho</a></u> 2024</p>
                <div id="feedback-container" class="feedback-container mt-4 hidden">
                    <h3 class="font-semibold mb-2 text-accent">Conversation Feedback:</h3>
                    <div id="conversation-feedback" class="text-sm text-gray-700"></div>
                </div>
            </div>

            <!-- Main Chat Interface -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-md p-6 h-full flex flex-col">
                    <!-- Tabs -->
                    <div class="mb-4">
                        <ul class="flex flex-wrap border-b">
                            <li class="mr-1">
                                <a class="bg-white inline-block py-2 px-4 text-accent hover:text-accent/80 font-semibold cursor-pointer tab"
                                    data-tab="debate">Debate</a>
                            </li>
                            <li class="mr-1">
                                <a class="bg-white inline-block py-2 px-4 text-accent hover:text-accent/80 font-semibold cursor-pointer tab"
                                    data-tab="storytelling">Storytelling</a>
                            </li>
                            <li class="mr-1">
                                <a class="bg-white inline-block py-2 px-4 text-accent hover:text-accent/80 font-semibold cursor-pointer tab"
                                    data-tab="qa">Q&A</a>
                            </li>
                            <li class="mr-1">
                                <a class="bg-white inline-block py-2 px-4 text-accent hover:text-accent/80 font-semibold cursor-pointer tab"
                                    data-tab="explain">Explain</a>
                            </li>
                        </ul>
                    </div>

                    <!-- Guidelines -->
                    <div id="guidelines" class="mb-4 p-4 bg-gray-100 rounded">
                        <h3 class="font-semibold mb-2 text-accent">Guidelines:</h3>
                        <p class="text-sm text-gray-700">Select a mode to see specific guidelines.</p>
                    </div>

                    <!-- Add this before the chat container -->
                    <div id="thinking" class="thinking hidden">
                        <span>AI is thinking</span>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>

                    <!-- Chat Container -->
                    <div class="flex-1 flex flex-col min-h-0"> <!-- This ensures proper height containment -->
                        <div id="thinking" class="thinking hidden">
                            <span class="text-gray-600">AI is thinking</span>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>

                        <div id="chat-container" class="flex-1 overflow-y-auto border border-gray-300 rounded p-4 mb-4 min-h-[150px]">
                            <!-- Messages will be appended here -->
                        </div>

                        <div class="flex flex-col items-center gap-4 mt-auto pt-4">
                            <button id="record-btn" class="record-btn bg-accent text-white rounded-full shadow-lg hover:bg-accent/80 transition">
                                <i class="fas fa-microphone mr-2"></i>Start Talking
                            </button>
                            <div id="timer" class="timer">00:00</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let conversationId = null;
        let timerInterval;
        let timerSeconds = 0;
        let currentMode = 'debate'; // Default mode

        const recordBtn = document.getElementById('record-btn');
        const chatContainer = document.getElementById('chat-container');
        const audioResponse = document.getElementById('audio-response');
        const timerDisplay = document.getElementById('timer');
        const waterCoolerPrompt = document.getElementById('water-cooler-prompt');
        const randomizePromptBtn = document.getElementById('randomize-prompt');
        const guidelines = document.getElementById('guidelines');

        // on page load
        document.addEventListener('DOMContentLoaded', async function () {
            randomizePrompt();
            switchTab('debate');
            await checkAndRequestMicrophonePermission();
        });

        const tabElements = document.querySelectorAll('.tab');
        tabElements.forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        recordBtn.addEventListener('click', toggleRecording);
        randomizePromptBtn.addEventListener('click', randomizePrompt);

        const guidelinesContent = {
            debate: "Use the SEXI template to structure your response:<br>1. <strong>S</strong>tate your position clearly.<br>2. <strong>E</strong>xplain your reasoning.<br>3. Provide an e<strong>X</strong>ample or evidence.<br>4. Describe the <strong>I</strong>mpact or importance of your argument.<br><br>Start with: 'My position on this topic is...'",
            storytelling: "Use the 5 C's of storytelling:<br>1. <strong>C</strong>haracters: Introduce the main character(s).<br>2. <strong>C</strong>onflict: Present a challenge or problem.<br>3. <strong>C</strong>hoice: Show the character's decision.<br>4. <strong>C</strong>onsequences: Describe the results of the choice.<br>5. <strong>C</strong>onclusion: Wrap up with a lesson or moral.<br><br>Start with: 'Let me tell you a story about...'",
            qa: "For asking questions, use the OPEN approach:<br>1. <strong>O</strong>pen-ended: Ask questions that can't be answered with just yes or no.<br>2. <strong>P</strong>robing: Dig deeper into the topic.<br>3. <strong>E</strong>mpathetic: Show understanding and interest.<br>4. <strong>N</strong>on-judgmental: Avoid assumptions or bias.<br><br>For answering, use the STAR method:<br>1. <strong>S</strong>ituation: Provide context.<br>2. <strong>T</strong>ask: Explain the challenge.<br>3. <strong>A</strong>ction: Describe what you did.<br>4. <strong>R</strong>esult: Share the outcome.<br><br>Start with: 'I'd like to ask about...' or 'To answer that question...'",
            explain: "Use the ELI5 (Explain Like I'm 5) method:<br>1. <strong>S</strong>implify: Break down complex ideas.<br>2. <strong>A</strong>nalogize: Use familiar comparisons.<br>3. <strong>V</strong>isualize: Paint a mental picture.<br>4. <strong>E</strong>xemplify: Provide concrete examples.<br><br>Start with: 'Imagine this concept as if it were...'",
        };

        function switchTab(mode) {
            currentMode = mode;
            tabElements.forEach(tab => {
                if (tab.dataset.tab === mode) {
                    tab.classList.add('border-b-2', 'border-accent');
                } else {
                    tab.classList.remove('border-b-2', 'border-accent');
                }
            });
            guidelines.innerHTML = `<h3 class="font-semibold mb-2 text-accent">Guidelines for ${mode.charAt(0).toUpperCase() +
                mode.slice(1)}:</h3>
                                                                            <p class="text-sm text-gray-700">${guidelinesContent[mode]}</p>`;
        }

        async function checkAndRequestMicrophonePermission() {
            // Check if permission was previously granted (using cookies)
            if (document.cookie.includes("microphonePermission=granted")) {
                console.log("Microphone permission previously granted.");
                return true;
            }

            try {
                const permissionStatus = await navigator.permissions.query({ name: 'microphone' });
                if (permissionStatus.state === 'granted') {
                    // Permission already granted
                    setMicrophonePermissionCookie();
                    return true;
                } else if (permissionStatus.state === 'prompt') {
                    // Request permission
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    setMicrophonePermissionCookie();
                    return true;
                } else {
                    console.warn('Microphone permission denied');
                    return false;
                }
            } catch (error) {
                console.error('Error checking microphone permission:', error);
                return false;
            }
        }

        function setMicrophonePermissionCookie() {
            // Set a cookie to remember permission
            document.cookie = "microphonePermission=granted; expires=Fri, 31 Dec 9999 23:59:59 GMT; path=/";
        }

        function randomizePrompt() {
            const prompts = [
                "How might society change if we achieve immortality through technology?",
                "What are the ethical implications of using AI in healthcare decision-making?",
                "How would our world be different if we could communicate telepathically?",
                "What are the potential consequences of discovering extraterrestrial life?",
                "How might education systems evolve in the next 50 years?",
                "What are the philosophical implications of living in a simulated reality?",
                "How might climate change affect global politics and economics in the coming decades?",
                "What are the potential societal impacts of widespread genetic engineering?",
                "How might the concept of work change with increasing automation and AI?",
                "What are the ethical considerations of mind uploading and digital consciousness?"
            ];

            fetch('https://philosophicalapi.pythonanywhere.com/')
                .then(response => response.json())
                .then(data => {
                    const randomPrompt = data.question;
                    waterCoolerPrompt.innerHTML = `<strong>Let's ponder:</strong> ${randomPrompt}`;
                })
                .catch(error => {
                    console.error('Error fetching prompt:', error);
                    // Fallback to local prompts if API call fails
                    const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
                    waterCoolerPrompt.innerHTML = `<strong>Let's consider:</strong> ${randomPrompt}`;
                });

            // Initial prompt display
            const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
            waterCoolerPrompt.innerHTML = `<strong>Let's consider:</strong> ${randomPrompt}`;
        }

        const endConversationBtn = document.getElementById('end-conversation-btn');
        const feedbackContainer = document.getElementById('feedback-container');
        const conversationFeedback = document.getElementById('conversation-feedback');

        endConversationBtn.addEventListener('click', endConversation);

        function toggleRecording() {
            if (!isRecording) {
                recordBtn.classList.add('recording');
                startRecording();
                document.getElementById('end-conversation-btn').classList.remove('hidden');
            } else {
                recordBtn.classList.remove('recording');
                stopRecording();
                document.getElementById('thinking').classList.remove('hidden');
            }
        }

        function endConversation() {
            if (isRecording) {
                stopRecording();
            }
            endConversationBtn.classList.add('hidden');
            // Add a small delay to ensure the last message is processed
            setTimeout(() => {
                getFeedback();
            }, 1500);
        }

        function getFeedback() {
            const formData = new FormData();
            formData.append("mode", currentMode);
            formData.append("conversation_id", conversationId);

            fetch('/get_feedback', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    // Sanitize the HTML feedback before inserting it
                    const sanitizedFeedback = DOMPurify.sanitize(data.feedback);
                    conversationFeedback.innerHTML = sanitizedFeedback;
                    feedbackContainer.classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error getting feedback:', error);
                });
        }

        async function startRecording() {
            const hasPermission = await checkAndRequestMicrophonePermission();
            if (!hasPermission) {
                alert('Microphone access is required for this app to function. Please grant permission and try again.');
                return;
            }

            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerHTML = '<i class="fas fa-stop mr-2"></i>Reply to AI';
                startTimer();
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Failed to start recording. Please make sure your microphone is connected and try again.');
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerHTML = '<i class="fas fa-microphone mr-2"></i>Record';
            stopTimer();
            sendAudioToServer();
        }

        function sendAudioToServer() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append("audio", audioBlob, "recording.webm");
                    formData.append("mode", currentMode);
                    if (conversationId) {
                        formData.append("conversation_id", conversationId);
                    }

                    // Ensure the audio data is fully captured before sending the request
                    setTimeout(() => {
                        fetch('/process_audio', {
                            method: 'POST',
                            body: formData
                        })
                            .then(response => {
                                document.getElementById('thinking').classList.add('hidden');
                                if (!response.ok) {
                                    throw new Error('Transcription error: ' + response.statusText);
                                }
                                return response.json();
                            })
                            .then(data => {
                                conversationId = data.conversation_id;
                                displayMessage(data.user_input, 'user');
                                displayMessage(data.ai_response, 'ai');
                                playAudioResponse(data.audio_response);
                            })
                            .catch(error => {
                                console.error(error);
                            });
                    }, 1000); // Adjust the delay as needed
                })
                .catch(error => {
                    console.error('Microphone access denied:', error);
                });
        }

        function displayMessage(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('flex', 'items-start', 'mb-4');

            const profilePic = document.createElement('div');
            profilePic.classList.add('w-8', 'h-8', 'rounded-full', 'mr-3', 'flex-shrink-0');
            profilePic.style.backgroundColor = sender === 'user' ? '#60A1E8' : '#10B981';

            const messageContainer = document.createElement('div');
            messageContainer.classList.add('message-container');

            const textContainer = document.createElement('div');
            textContainer.classList.add('bg-gray-100', 'rounded', 'px-4', 'py-2');
            textContainer.textContent = message;

            messageContainer.appendChild(textContainer);

            // Only add audio player for AI messages, remove subtitles since text is already shown
            if (sender === 'ai') {
                const audioElement = document.createElement('audio');
                audioElement.classList.add('message-audio');
                audioElement.controls = true;
                if (window.lastAudioResponse) {
                    audioElement.src = "data:audio/mp3;base64," + window.lastAudioResponse;
                }
                messageContainer.appendChild(audioElement);
            }

            messageElement.appendChild(profilePic);
            messageElement.appendChild(messageContainer);

            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function playAudioResponse(audioData) {
            window.lastAudioResponse = audioData; // Store for future messages
            const lastMessage = chatContainer.lastElementChild;
            if (lastMessage) {
                const audioElement = lastMessage.querySelector('audio');
                if (audioElement) {
                    audioElement.src = "data:audio/mp3;base64," + audioData;
                    audioElement.play().catch(error => {
                        console.warn('Autoplay was prevented. User interaction may be required.');
                    });
                }
            }
        }

        function startTimer() {
            stopTimer(); // Clear any existing interval
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const seconds = (timerSeconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (timerSeconds >= 30) {
                timerDisplay.style.color = '#ef4444';
            } else {
                timerDisplay.style.color = '#60A1E8';
            }
        }
    </script>
</body>

</html>
